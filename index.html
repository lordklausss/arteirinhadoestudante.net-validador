<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Documento Nacional do Estudante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Formas geométricas de fundo */
        .shape-purple {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background-color: #7b2cbf;
            border-radius: 50%;
            opacity: 0.8;
            z-index: 0;
        }

        .shape-blue {
            position: absolute;
            bottom: -80px;
            right: -50px;
            width: 400px;
            height: 200px;
            background-color: #1e3a8a;
            transform: rotate(-15deg);
            z-index: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
            margin-bottom: 20px;
        }

        .logo-dne {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -2px;
            margin: 0;
        }

        .logo-dne span {
            font-weight: normal;
            font-size: 14px;
            display: block;
            letter-spacing: 0;
            color: #1e3a8a;
            margin-top: -5px;
        }

        .header-logos {
            display: flex;
            gap: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .content-area {
            display: flex;
            z-index: 1;
            flex: 1;
        }

        .photo-container {
            width: 180px;
            height: 240px;
            background-color: #ccc;
            border-radius: 5px;
            overflow: hidden;
            margin-right: 20px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 10px;
        }

        /* Estilos dos textos solicitados (sem negrito) */
        .name {
            font-size: 24px;
            font-weight: normal; /* Sem negrito */
            color: #000;
            margin: 0 0 20px 0;
        }

        .field-group {
            margin-bottom: 10px;
        }

        .field-label {
            font-weight: normal; /* Sem negrito */
            color: #000;
            font-size: 16px;
        }

        .field-value {
            font-weight: normal; /* Sem negrito */
            color: #000;
            font-size: 16px;
        }

        .course {
            font-size: 18px;
            font-weight: normal; /* Sem negrito */
            color: #000;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        .institution {
            font-size: 18px;
            font-weight: normal; /* Sem negrito */
            color: #000;
        }

        .new-fields {
            margin-top: 15px;
            font-size: 14px;
            font-weight: normal; /* Sem negrito */
            color: #000;
        }

        .right-panel {
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            margin-left: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .qr-code {
            width: 130px;
            height: 130px;
            background-color: #000;
            /* Placeholder para o QR Code */
            background-image: repeating-linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff), repeating-linear-gradient(45deg, #fff 25%, #000 25%, #000 75%, #fff 75%, #fff);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            margin-bottom: 10px;
        }

        .cod-uso {
            font-size: 14px;
            text-align: center;
            color: #555;
            font-weight: normal;
        }

        .cod-value {
            font-size: 16px;
            font-weight: normal;
            color: #000;
            margin-top: 5px;
        }

        .year {
            font-size: 36px;
            font-weight: bold;
            color: #1e3a8a;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Formas de fundo -->
        <div class="shape-purple"></div>
        <div class="shape-blue"></div>

        <!-- Cabeçalho -->
        <div class="header">
            <div class="logo-dne">
                dne
                <span>Documento<br>Nacional<br>do Estudante</span>
            </div>
            <div class="header-logos">
                <span>UNE</span>
                <span>UBES</span>
                <span>ANPG</span>
            </div>
        </div>

        <!-- Área Principal -->
        <div class="content-area">
            <!-- Foto do Aluno -->
            <div class="photo-container">
                <!-- Substitua o 'src' pela imagem real ou Base64 -->
                <img src="sua-foto.jpg" alt="Foto do Estudante">
            </div>

            <!-- Informações do Aluno -->
            <div class="info-container">
                <!-- Nome (Sem Negrito) -->
                <h1 class="name">CLAUDIO FILHO RODRIGUES</h1>

                <!-- CPF e Data -->
                <div class="field-group">
                    <span class="field-label">CPF/CIN: </span>
                    <span class="field-value">701.915.551-00</span>
                </div>
                <div class="field-group">
                    <span class="field-label">SSP/GO</span>
                </div>
                <div class="field-group">
                    <span class="field-label">Data nasc.: </span>
                    <span class="field-value">12/09/1996</span>
                </div>

                <!-- Curso e Instituição (Sem Negrito) -->
                <div class="course">ANÁLISE DE SISTEMAS</div>
                <div class="institution">CENTRO UNIVERSITÁRIO UNIGOIAS</div>

                <!-- Novos campos adicionados (Sem Negrito) -->
                <div class="new-fields">
                    Certificado de Atributo em formato PEM:
                </div>
            </div>

            <!-- Painel Direito (QR Code e Código) -->
            <div class="right-panel">
                <div class="qr-code"></div>
                <div class="cod-uso">
                    Cod. uso / CIE
                    <div class="cod-value">26000026327</div>
                </div>
                <div class="year">2026</div>
            </div>
        </div>
    </div>

</body>
</html>
